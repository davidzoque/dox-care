name: Build release ZIP

# Al pushear un tag v* se crea la release con un ZIP limpio del plugin.
# Plugin Update Checker (enableReleaseAssets) sirve ese ZIP a las webs.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verificar que la versión del plugin coincide con el tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PLUGIN_VERSION=$(grep -oP '^ \* Version:\s+\K[0-9.]+' dox-care.php)
          CONST_VERSION=$(grep -oP "define\( 'DOX_CARE_VERSION', '\K[0-9.]+" dox-care.php)
          echo "Tag: $TAG_VERSION | Cabecera: $PLUGIN_VERSION | Constante: $CONST_VERSION"
          if [ "$TAG_VERSION" != "$PLUGIN_VERSION" ] || [ "$TAG_VERSION" != "$CONST_VERSION" ]; then
            echo "::error::La versión del plugin no coincide con el tag."
            exit 1
          fi

      - name: Construir ZIP limpio
        run: |
          mkdir -p build/dox-care
          rsync -a \
            --exclude='.git*' \
            --exclude='.github' \
            --exclude='build' \
            --exclude='*.zip' \
            --exclude='*.pot' \
            --exclude='README.md' \
            ./ build/dox-care/
          cd build
          zip -rq dox-care.zip dox-care

      - name: Crear release y adjuntar ZIP
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: build/dox-care.zip
          # Sin notas: la copia del actualizador que trae Hide My WP no tiene
          # Parsedown y da error fatal al leer una release con texto.
          generate_release_notes: false
